<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Shop</title>
    <link rel="stylesheet" href="flexbox.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="effects.css">
    <!--*Añadir icono*-->
</head>
<body>
    <!--Mensaje informativo-->
    <div id="message"></div>
    <!--Encabezado-->
    <header>
        <div class="row">
            <div id="home-title-cs">
                <h1>CS</h1>
                <h2>Your classic</h2>
            </div>
            <div id="home-title-shop">
                <h1>Shop</h1>
                <h2>Beauty Shop</h2>
            </div>
        </div>
    </header>
    <!--Navegador-->
    <nav>
        <div id="home-nav" class="row">
            <button id="btn-home" class="btn-nav">Home</button>
            <button id="btn-products" class="btn-nav">Products</button>
            <button id="btn-shoppingcart" class="btn-nav">Shopping Cart</button>
            <button id="btn-account" class="btn-account">My Account</button>
        </div>
    </nav>
    <!--Contenido principal-->
    <main>
        <div id="home-line"></div>
        <div id="main">
            <h3>Welcome to CS Shop</h3>
            <p>Wanna be pretty? in CS Shop you can find a wide variety of high-quality beauty products.</p>
            <div id="home-frame">
                <img id="home-img" src="./media/Front-page.jpeg" alt="Front page">
            </div>
        </div>
    </main>
    <!--Pie de página-->
    <footer>
        <div id="home-footer">
            <a href="./media/Contact us.jpg">Contact us</a>
        </div>
    </footer>
</body>
<!--Codigo de la página-->
<script src="index.js"></script>
</html>
