<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Shop</title>
    <link rel="stylesheet" href="flexbox.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="effects.css">
    <!--Añadir icono-->
</head>
<body>
    <div id="div-message"></div>
    <header>
        <div class="row">
            <div id="title-cs">
                <h1>CS</h1>
                <h2>Your classic</h2>
            </div>
            <div id="title-shop">
                <h1>Shop</h1>
                <h2>Beauty Shop</h2>
            </div>
        </div>
    </header>
    <nav>
        <div id="div-nav">
            <button id="btn-home" class="nav-buttons">Home</button>
            <button id="btn-products" class="nav-buttons">Products</button>
            <button id="btn-shopcart" class="nav-buttons">Shopping Cart</button>
            <button id="btn-account" class="nav-buttons">My Account</button>
        </div>
    </nav>
    <main>
        <div id="div-line"></div>
        <div id="div-main">
            <h3>Welcome to CS Shop</h3>
            <p>Wanna be pretty? in CS Shop you can find a wide variety of high-quality beauty products.</p>
            <div class="div-img">
                <div class="row">
                    <button id="btn-left-slide" class="btn-slide"><</button>
                    <img id="img-front-page" src="./media/Front-page1.jpeg" alt="Front page">
                    <button id="btn-right-slide" class="btn-slide">></button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div id="div-footer">
            <a href="./media/Contact us.jpg">Contact us</a>
        </div>
    </footer>
</body>
<script src="index.js"></script>
</html>
