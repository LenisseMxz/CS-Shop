<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Shop</title>
    <link rel="stylesheet" href="flexbox.css">
    <link rel="stylesheet" href="styles.css">
    <!--Añadir icono-->
</head>
<body>
    <header>
        <div class="row">
            <div id="title-cs">
                <h1>CS</h1>
                <h2>Your classic</h2>
            </div>
            <div id="title-shop">
                <h1>Shop</h1>
                <h2>Beauty Shop</h2>
            </div>
        </div>
    </header>
    <nav>
        <div class="row">
            <div id="div-nav">
                <button class="nav-button">Home</button>
                <button class="nav-button">Products</button>
                <button class="nav-button">Shopping Cart</button>
                <button class="nav-button">MyAccount</button>
            </div>
        </div>
    </nav>
    <main>
        <div id="div-line"></div>
        <div id="div-main">
            <h3>Welcome to CS Shop</h3>
            <p>Wanna be pretty? in CS Shop you can find a wide variety of high-quality beauty products.</p>
            <div class="div-img">
                <img id="img-front-page" src="./media/Front-page.jpeg" alt="Front page">
            </div>
        </div>
    </main>
    <footer>
        <div id="div-footer">
            <a href="">Contact us</a>
        </div>
    </footer>
</body>
</html>
